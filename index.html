<html lang="ko">
<head>
<meta charset="utf-8">

<title>집 공사 계산기 – 타일·도배·페인트 수량 계산</title>
<meta name="description" content="타일, 도배지, 페인트, 장판 등 집 공사에 필요한 자재 수량을 무료로 바로 계산하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1011; --card:#18191b; --ink:#f3f3f1; --muted:#a9adb0; --line:#2c2e31;
  --field:#111214; --accent:#7fd8bd; --accent-soft:rgba(127,216,189,.14); --soft:#1c1f20;
  --shadow:none;
  --radius:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:720px;margin:0 auto;padding:40px 16px 72px}
header{text-align:center;margin-bottom:8px}
header h1{font-size:1.6rem;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em}
header p{margin:0;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;margin-top:20px;box-shadow:var(--shadow)}
.card h2{font-size:1rem;font-weight:600;margin:0 0 14px;color:var(--ink)}
.card h2 .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.8rem;margin-right:8px;vertical-align:1px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--field);color:var(--ink);font-size:1rem;font-family:inherit;
  transition:border-color .2s, background .2s}
input::placeholder{color:#6b7074}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card);
  box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.del{border:none;background:transparent;color:#6b7074;font-size:1.25rem;cursor:pointer;
  padding:8px 10px;line-height:1;border-radius:10px;transition:color .2s, background .2s}
.del:hover{color:var(--muted);background:var(--field)}
.add{margin-top:6px;border:1px dashed var(--line);background:transparent;color:var(--muted);
  border-radius:12px;padding:11px 12px;cursor:pointer;font-size:.9rem;width:100%;font-family:inherit;
  transition:all .2s}
.add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.hint{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.divider{height:1px;background:var(--line);margin:22px 0}
.result{background:var(--soft);border-color:var(--line);box-shadow:none}
.big{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:#232528;border-radius:16px;padding:18px 20px}
.stat .k{font-size:.85rem;color:var(--muted)}
.stat .v{font-size:1.9rem;font-weight:600;color:var(--accent);letter-spacing:-0.01em;line-height:1.3;margin-top:2px}
.stat .v small{font-size:.95rem;font-weight:400;color:var(--muted);margin-left:3px}
.detail{margin-top:14px;font-size:.9rem;color:var(--muted);line-height:1.9}
.detail b{color:var(--ink);font-weight:500}
.ad-slot{margin-top:20px;min-height:0}
article{margin-top:44px;padding:0 4px}
article h2{font-size:1.1rem;font-weight:600;margin:36px 0 10px}
article h3{font-size:.98rem;font-weight:600;margin:22px 0 4px}
article p,article li{color:#d8d9d7}
article table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin:10px 0;
  background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
article th,article td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:left}
article tr:last-child td{border-bottom:none}
article th{color:var(--muted);font-weight:500;background:var(--field)}
footer{margin-top:48px;font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:560px){
  .wrap{padding-top:28px}
  .card{padding:20px 18px}
  .g2,.g3{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr 1fr auto}
  .row .name{grid-column:1 / -1}
  .big{grid-template-columns:1fr 1fr}
  .stat{padding:14px 16px}
  .stat .v{font-size:1.6rem}
}
</style>
<style>
.list{display:grid;gap:12px;margin-top:24px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:20px 22px;color:var(--ink);text-decoration:none;transition:border-color .2s}
a.item:hover{border-color:var(--accent)}
.item b{font-weight:600;font-size:1.05rem}
.item span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.go{color:var(--accent);font-size:1.3rem}
.soon{opacity:.5}
.tag{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>집 공사 계산기</h1>
    <p>자재 수량, 이제 어림짐작하지 말고 바로 계산하세요.</p>
  </header>
  <div class="list">
    <a class="item" href="/tile/"><div><b>타일 수량 계산기</b><span>필요한 타일 장수 · 박스 수 · 예상 비용</span></div><div class="go">→</div></a>
    <a class="item" href="/wallpaper/"><div><b>도배지 계산기</b><span>필요한 벽지 롤 수 · 실크 / 합지</span></div><div class="go">→</div></a>
    <div class="item soon"><div><b>페인트 계산기</b><span>필요한 페인트 양 · 통 수</span></div><div class="tag">준비 중</div></div>
    <div class="item soon"><div><b>장판 · 마루 계산기</b><span>필요한 장판 길이 · 마루 박스 수</span></div><div class="tag">준비 중</div></div>
  </div>
  <footer>모든 계산 결과는 참고용 추정치입니다.</footer>
</div>
</body>
</html>
